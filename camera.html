<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramadan AI Photo Booth - Camera</title>
    <link rel="stylesheet" href="camera.css">
</head>
<body>
    <!-- Camera Screen (Black Background, Full Width) -->
    <main class="camera-screen">
        <!-- Background Image -->
        <div class="camera-background"></div>
        
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        
        <div class="camera-container">
            <!-- Video/Canvas Container (Full Width) -->
            <div class="camera-content">
                <video id="video" autoplay playsinline style="display: none;"></video>
                <canvas id="outputCanvas" style="display: none;"></canvas>
                <canvas id="canvas" style="display: none;"></canvas>
                
                <!-- Start Camera Button (hidden, only shows if auto-start fails) -->
                <div id="startCamera" class="action-button" style="display: none;">
                    <div class="tap-box">TAP TO START</div>
                </div>
                
                <!-- Capture Button -->
                <div id="captureBtn" class="action-button" style="display: none;">
                    <div class="tap-box">CAPTURE</div>
                </div>
                
                <!-- Approve/Retake Controls -->
                <div class="approve-controls" style="display: none;">
                    <button id="retakeBtn" class="portal-btn">
                        <div class="tap-box-small">RETAKE</div>
                    </button>
                    <button id="approveBtn" class="portal-btn">
                        <div class="tap-box-small">APPROVE</div>
                    </button>
                </div>
                
                <!-- Style Selector (appears after capture before approve) -->
                <div id="styleSelector" class="style-selector-fullwidth" style="display: none;">
                    <div class="style-option" data-style="realistic">
                        <div class="tap-box-small">REALISTIC</div>
                    </div>
                    <div class="style-option" data-style="disney">
                        <div class="tap-box-small">DISNEY</div>
                    </div>
                </div>
                
                <!-- Result Controls -->
                <div class="result-controls" style="display: none;">
                    <button id="downloadBtn" class="portal-btn">
                        <div class="tap-box-small">DOWNLOAD</div>
                    </button>
                    <button id="printBtn" class="portal-btn">
                        <div class="tap-box-small">PRINT</div>
                    </button>
                    <button id="newPhotoBtn" class="portal-btn">
                        <div class="tap-box-small">NEW PHOTO</div>
                    </button>
                </div>
            </div>
            
            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="spinner-overlay" style="display: none;">
                <div class="spinner-circle"></div>
                <p class="loading-text">please wait a moment while AI does it's magic</p>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="camera.js"></script>
</body>
</html>
